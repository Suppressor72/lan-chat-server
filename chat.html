<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAN Chat</title>
<style>
:root {
  --bg: #1a1a2e;
  --surface: #16213e;
  --surface2: #0f3460;
  --accent: #e94560;
  --text: #eee;
  --text-dim: #999;
  --user-bg: #0f3460;
  --bot-bg: #1a1a2e;
  --radius: 12px;
  --tool-bg: #1b2838;
  --tool-border: #2a4a6b;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: row;
  overflow: hidden;
}
/* Sidebar */
#sidebar {
  width: 240px;
  flex-shrink: 0;
  background: #111;
  border-right: 1px solid rgba(255,255,255,0.05);
  display: flex;
  flex-direction: column;
  transition: margin-left 0.2s ease;
}
#sidebar.collapsed { margin-left: -240px; }
#sidebar-header {
  padding: 12px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
#new-chat-btn {
  flex: 1;
  background: var(--surface2);
  color: var(--text);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  text-align: center;
}
#new-chat-btn:hover { background: var(--accent); }
#conv-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}
.conv-item {
  padding: 8px 10px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  margin-bottom: 2px;
  transition: background 0.15s;
}
.conv-item:hover { background: rgba(255,255,255,0.05); }
.conv-item.active { background: var(--surface2); color: var(--text); }
.conv-item .conv-title {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.conv-item .conv-delete {
  opacity: 0;
  flex-shrink: 0;
  font-size: 14px;
  color: var(--text-dim);
  background: none;
  border: none;
  cursor: pointer;
  padding: 0 2px;
}
.conv-item:hover .conv-delete { opacity: 0.6; }
.conv-item .conv-delete:hover { opacity: 1; color: var(--accent); }
/* Main content */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
#header {
  background: var(--surface);
  padding: 12px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
#header h1 { font-size: 16px; font-weight: 600; }
#header .subtitle { font-size: 12px; color: var(--text-dim); }
#status-dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #444;
  margin-right: 6px;
  transition: background 0.3s;
}
#status-dot.online { background: #4ade80; }
#status-dot.offline { background: #f87171; }
.status-row {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 11px;
  color: var(--text-dim);
  flex-wrap: wrap;
}
.status-item {
  display: flex;
  align-items: center;
  gap: 4px;
}
.status-item .dot {
  display: inline-block;
  width: 7px; height: 7px;
  border-radius: 50%;
  background: #444;
  transition: background 0.3s;
}
.status-item .dot.up { background: #4ade80; }
.status-item .dot.down { background: #f87171; }
#chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.msg {
  max-width: 85%;
  padding: 14px 18px;
  border-radius: var(--radius);
  line-height: 1.6;
  font-size: 14px;
  word-wrap: break-word;
}
.msg-content {
  white-space: pre-wrap;
}
.msg.user {
  background: var(--user-bg);
  align-self: flex-end;
  border-bottom-right-radius: 4px;
}
.msg.assistant {
  background: var(--surface);
  align-self: flex-start;
  border-bottom-left-radius: 4px;
  border: 1px solid rgba(255,255,255,0.05);
  max-width: 90%;
}
.msg .role-tag {
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 4px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
/* Markdown tables — size to content, not full chat width */
.msg table {
  border-collapse: collapse;
  width: max-content;
  max-width: 100%;
  margin: 8px 0;
  font-size: 13px;
  white-space: normal;
  table-layout: auto;
}
.msg th, .msg td {
  border: 1px solid rgba(255,255,255,0.12);
  padding: 5px 10px;
  text-align: left;
  vertical-align: middle;
}
.msg th {
  background: rgba(255,255,255,0.06);
  font-weight: 600;
}
.msg tr:nth-child(even) td {
  background: rgba(255,255,255,0.02);
}
/* Tool call indicators */
.tool-indicator {
  align-self: center;
  max-width: 70%;
  width: 100%;
  background: var(--tool-bg);
  border: 1px solid var(--tool-border);
  border-radius: var(--radius);
  padding: 10px 16px;
  font-size: 13px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.tool-indicator .tool-icon {
  font-size: 16px;
  flex-shrink: 0;
  margin-top: 2px;
}
.tool-indicator .tool-content { flex: 1; }
.tool-indicator .tool-label {
  font-weight: 600;
  font-size: 12px;
  color: #60a5fa;
  margin-bottom: 2px;
}
.tool-indicator .tool-query {
  color: var(--text-dim);
  font-style: italic;
}
.tool-indicator .tool-results {
  margin-top: 8px;
  color: var(--text);
  font-size: 12px;
  line-height: 1.5;
  max-height: 150px;
  overflow-y: auto;
}
.tool-indicator .tool-results .result-item {
  padding: 6px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.tool-indicator .tool-results .result-item:last-child { border-bottom: none; }
.tool-indicator .tool-results .result-title {
  color: #60a5fa;
  font-weight: 500;
}
.tool-indicator .tool-results .result-url {
  color: #4ade80;
  font-size: 11px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.tool-indicator .tool-results .result-snippet {
  color: var(--text-dim);
  font-size: 12px;
}
/* Spinner */
.thinking-block {
  margin: 0 0 8px;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px;
  background: rgba(0,0,0,0.25);
  overflow: hidden;
}
.thinking-block > summary {
  list-style: none;
}
.thinking-block > summary::-webkit-details-marker {
  display: none;
}
.thinking-summary {
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-dim);
  cursor: pointer;
  user-select: none;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: background 0.15s, color 0.15s;
}
.thinking-summary:hover {
  background: rgba(255,255,255,0.04);
  color: var(--text);
}
.thinking-content {
  padding: 10px 12px;
  font-size: 12px;
  line-height: 1.5;
  color: #a0a0b0;
  border-top: 1px solid rgba(255,255,255,0.05);
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 250px;
  overflow-y: auto;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}
.spinner {
  display: inline-block;
  width: 14px;
  height: 14px;
  border: 2px solid var(--tool-border);
  border-top-color: #60a5fa;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  vertical-align: middle;
  margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }
/* Input area */
#input-area {
  background: var(--surface);
  padding: 16px 20px;
  border-top: 1px solid rgba(255,255,255,0.05);
  display: flex;
  gap: 10px;
  align-items: flex-end;
}
#prompt {
  flex: 1;
  background: var(--bg);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: var(--radius);
  color: var(--text);
  padding: 12px 16px;
  font-size: 14px;
  font-family: inherit;
  resize: none;
  min-height: 24px;
  max-height: 200px;
  line-height: 1.5;
}
#prompt:focus { outline: none; border-color: var(--accent); }
#send {
  background: var(--accent);
  color: white;
  border: none;
  border-radius: var(--radius);
  padding: 12px 24px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: opacity 0.2s;
}
#send:hover { opacity: 0.9; }
#send:disabled { opacity: 0.4; cursor: not-allowed; }
#send.stopping { background: #e74c3c; }
#controls {
  display: flex;
  gap: 12px;
  align-items: center;
  font-size: 12px;
}
#controls label { color: var(--text-dim); display: flex; align-items: center; gap: 4px; }
#controls input[type="checkbox"] { accent-color: var(--accent); }

/* Model selector dropdown */
#model-select {
  background: var(--bg-input);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 8px;
  font-size: 12px;
  cursor: pointer;
  outline: none;
}
#model-select option {
  background: #1a1a1a;
  color: #e0e0e0;
  padding: 6px;
}
#model-select:focus { border-color: var(--accent); }

#model-refresh-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: 6px;
  padding: 4px 8px;
  cursor: pointer;
  font-size: 14px;
}
#model-refresh-btn:hover { color: var(--text); border-color: var(--accent); }
#clear-btn {
  background: transparent;
  color: var(--text-dim);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 12px;
  cursor: pointer;
}
#clear-btn:hover { color: var(--text); }
.typing { color: var(--text-dim); font-style: italic; }
.typing-indicator { display: flex; align-items: center; gap: 8px; color: var(--text-dim); font-style: italic; }
.typing-dots { display: inline-flex; gap: 4px; }
.typing-dots span {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--text-dim);
  animation: typing-dot 1.4s infinite ease-in-out;
}
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes typing-dot {
  0%, 60%, 100% { opacity: 0.3; transform: scale(0.8); }
  30% { opacity: 1; transform: scale(1.2); }
}
code { background: rgba(255,255,255,0.08); padding: 2px 6px; border-radius: 4px; font-size: 13px; }
pre { background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; overflow-x: auto; margin: 8px 0; position: relative; }
pre code { background: none; padding: 0; }
pre .code-copy-btn {
  position: absolute;
  top: 6px; right: 6px;
  background: rgba(255,255,255,0.08);
  color: var(--text-dim);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 4px;
  padding: 2px 8px;
  font-size: 11px;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.15s;
}
pre:hover .code-copy-btn { opacity: 1; }
pre .code-copy-btn:hover { background: rgba(255,255,255,0.15); color: var(--text); }
pre .code-copy-btn.copied { background: #2d5a3d; color: #4ade80; opacity: 1; }
.msg-copy-btn {
  background: none;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 12px;
  opacity: 0;
  transition: opacity 0.15s;
  padding: 0 4px;
}
.msg:hover .msg-copy-btn { opacity: 0.5; }
.msg-copy-btn:hover { opacity: 1 !important; }
.msg-copy-btn.copied { opacity: 1 !important; color: #4ade80; }

/* Token stats bar below assistant messages */
.msg-stats {
  margin-top: 6px;
  padding: 4px 10px;
  font-size: 11px;
  color: var(--text-dim);
  border-top: 1px solid rgba(255,255,255,0.05);
  font-family: monospace;
  white-space: nowrap;
  overflow-x: auto;
}

a { color: #60a5fa; text-decoration: none; }
a:hover { text-decoration: underline; }
/* Settings modal */
#settings-overlay {
  display: none;
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.6);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}
#settings-overlay.open { display: flex; }
#settings-modal {
  background: var(--surface);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  padding: 20px;
  width: 90%; max-width: 600px;
  max-height: 80vh;
  overflow-y: auto;
}
#settings-modal h2 { font-size: 16px; margin-bottom: 12px; }
#settings-modal textarea {
  width: 100%;
  min-height: 200px;
  background: var(--bg);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  color: var(--text);
  padding: 12px;
  font-size: 13px;
  font-family: monospace;
  line-height: 1.5;
  resize: vertical;
}
#settings-modal .hint { font-size: 12px; color: var(--text-dim); margin: 8px 0 12px; }
#settings-modal .toggle-row {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 16px;
  padding: 12px;
  background: var(--bg);
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.06);
}
#settings-modal .toggle-row label {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 13px;
  color: var(--text);
  cursor: pointer;
  line-height: 1.4;
}
#settings-modal .toggle-row label input {
  margin-top: 2px;
  accent-color: var(--accent);
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}
#settings-modal .toggle-row .toggle-desc {
  display: block;
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 2px;
}
#settings-modal .actions { display: flex; gap: 10px; justify-content: flex-end; }
#settings-modal button {
  padding: 8px 16px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.1);
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
}
#settings-modal .save-btn { background: var(--accent); color: white; }
#settings-modal .cancel-btn { background: transparent; color: var(--text-dim); }
#settings-modal .reset-btn { background: transparent; color: var(--text-dim); font-size: 12px; }
#gear-btn {
  background: none;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 16px;
  padding: 4px 8px;
}
#gear-btn:hover { color: var(--text); }
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <button id="new-chat-btn" onclick="newChat()">+ New Chat</button>
  </div>
  <div id="conv-list"></div>
</div>

<div id="main">
<div id="header">
  <div style="display: flex; align-items: center; gap: 10px;">
    <button id="sidebar-toggle" onclick="toggleSidebar()" style="background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 18px; padding: 4px;">☰</button>
    <div>
      <h1>&#129302; LAN Chat</h1>
      <div class="subtitle">
        <div class="status-row">
          <div class="status-item"><span id="dot-server" class="dot"></span>Server</div>
          <div class="status-item"><span id="dot-proxy" class="dot"></span>Proxy</div>
          <div class="status-item"><span id="dot-vllm" class="dot"></span><span id="vllm-label">vLLM</span></div>
        </div>
      </div>
    </div>
  </div>
  <div id="controls">
    <select id="model-select" onchange="onModelChange()" title="Select model">
      <option value="">Loading models...</option>
    </select>
    <button id="model-refresh-btn" onclick="loadModels()" title="Refresh model list">↻</button>
    <label><input type="checkbox" id="think-toggle" checked> Thinking</label>
    <button id="gear-btn" onclick="openSettings()" title="System prompt settings">⚙</button>
    <button id="clear-btn" onclick="clearChat()">Clear</button>
  </div>
</div>

<div id="chat"></div>

<div id="input-area">
  <textarea id="prompt" placeholder="Type a message... (Enter to send, Shift+Enter for new line)" rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
  <button id="send" onclick="sendMessage()">Send</button>
</div>
</div>

<div id="settings-overlay" onclick="if(event.target===this) closeSettings()">
  <div id="settings-modal">
    <h2>System Prompt</h2>
    <textarea id="system-prompt-input" placeholder="Optional custom instructions for the assistant..."></textarea>
    <div class="hint">
      Custom text is inserted between date/time and the web-search tool block
      (whichever of those are enabled below). Leave blank for defaults only.
    </div>
    <div class="toggle-row">
      <label>
        <input type="checkbox" id="include-datetime" checked>
        <span>
          Include current date/time
          <span class="toggle-desc">Injects “Current date and time: …” at the top of the system prompt.</span>
        </span>
      </label>
      <label>
        <input type="checkbox" id="include-search" checked>
        <span>
          Enable web search tool instructions
          <span class="toggle-desc">Advertises [[search]] markers and allows the server to run web search. Off = offline-only.</span>
        </span>
      </label>
    </div>
    <div class="actions">
      <button class="reset-btn" onclick="resetSystemPrompt()" style="margin-right:auto">Reset</button>
      <button class="cancel-btn" onclick="closeSettings()">Cancel</button>
      <button class="save-btn" onclick="saveSystemPrompt()">Save</button>
    </div>
  </div>
</div>

<script>
const API_URL = '/chat';
const VLLM_MODELS_URL = '/models';
const VLLM_REFRESH_URL = '/refresh';
let messages = [];
let busy = false;
let conversations = [];      // [{id, title, messages}]
let activeConvId = null;
let selectedModel = localStorage.getItem('chat-selected-model') || '';
let abortController = null;  // AbortController for the active fetch, if any
let systemPrompt = '';       // Custom system prompt (localStorage)
let includeDatetime = true;  // Inject current date/time into system prompt
let includeSearch = true;    // Include web-search tool instructions + allow tool loop

// ── Conversation persistence ────────────────────────────────────────────────
const STORAGE_KEY = 'lan-chat-conversations';
const PROMPT_KEY = 'lan-chat-system-prompt';       // legacy string key (migrated)
const SETTINGS_KEY = 'lan-chat-settings';          // {system_prompt, include_datetime, include_search}

function loadSystemPrompt() {
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      systemPrompt = s.system_prompt || '';
      includeDatetime = s.include_datetime !== false;
      includeSearch = s.include_search !== false;
      return;
    }
    // Migrate legacy plain-string prompt key
    systemPrompt = localStorage.getItem(PROMPT_KEY) || '';
    includeDatetime = true;
    includeSearch = true;
  } catch {
    systemPrompt = '';
    includeDatetime = true;
    includeSearch = true;
  }
}

function persistSettings() {
  try {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify({
      system_prompt: systemPrompt,
      include_datetime: includeDatetime,
      include_search: includeSearch,
    }));
  } catch {}
}

function openSettings() {
  document.getElementById('system-prompt-input').value = systemPrompt;
  document.getElementById('include-datetime').checked = includeDatetime;
  document.getElementById('include-search').checked = includeSearch;
  document.getElementById('settings-overlay').classList.add('open');
  document.getElementById('system-prompt-input').focus();
}

function closeSettings() {
  document.getElementById('settings-overlay').classList.remove('open');
}

function saveSystemPrompt() {
  systemPrompt = document.getElementById('system-prompt-input').value;
  includeDatetime = document.getElementById('include-datetime').checked;
  includeSearch = document.getElementById('include-search').checked;
  persistSettings();
  closeSettings();
}

function resetSystemPrompt() {
  document.getElementById('system-prompt-input').value = '';
  document.getElementById('include-datetime').checked = true;
  document.getElementById('include-search').checked = true;
}

function loadConversations() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    conversations = raw ? JSON.parse(raw) : [];
  } catch { conversations = []; }
  // Restore active conversation
  const lastId = localStorage.getItem(STORAGE_KEY + ':active');
  if (lastId && conversations.find(c => c.id === lastId)) {
    activeConvId = lastId;
  } else if (conversations.length > 0) {
    activeConvId = conversations[0].id;
  }
}

function saveConversations() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
}

function getActiveConv() {
  return conversations.find(c => c.id === activeConvId);
}

function newChat() {
  activeConvId = null;
  messages = [];
  document.getElementById('chat').innerHTML = '';
  renderConvList();
  saveConversations();
  document.getElementById('prompt').focus();
}

function startNewConversation(firstMsg) {
  const conv = {
    id: 'c' + Date.now(),
    title: firstMsg.slice(0, 40) + (firstMsg.length > 40 ? '…' : ''),
    messages: [{ role: 'user', content: firstMsg }],
  };
  conversations.unshift(conv);
  activeConvId = conv.id;
  renderConvList();
  saveConversations();
}

function switchConversation(convId) {
  const conv = conversations.find(c => c.id === convId);
  if (!conv) return;
  activeConvId = convId;
  messages = [...conv.messages];
  localStorage.setItem(STORAGE_KEY + ':active', convId);
  // Rebuild chat UI
  const chat = document.getElementById('chat');
  chat.innerHTML = '';
  for (const msg of conv.messages) {
    if (msg.role === 'user') addMsg('user', msg.content);
    else if (msg.role === 'assistant') addMsg('assistant', msg.content, msg.reasoning);
  }
  renderConvList();
  document.getElementById('prompt').focus();
}

function deleteConversation(convId, event) {
  event.stopPropagation();
  conversations = conversations.filter(c => c.id !== convId);
  if (activeConvId === convId) {
    if (conversations.length > 0) {
      switchConversation(conversations[0].id);
    } else {
      newChat();
    }
  }
  renderConvList();
  saveConversations();
}

function renderConvList() {
  const list = document.getElementById('conv-list');
  list.innerHTML = '';
  for (const conv of conversations) {
    const div = document.createElement('div');
    div.className = 'conv-item' + (conv.id === activeConvId ? ' active' : '');
    div.onclick = () => switchConversation(conv.id);
    const title = document.createElement('span');
    title.className = 'conv-title';
    title.textContent = conv.title;
    const del = document.createElement('button');
    del.className = 'conv-delete';
    del.textContent = '×';
    del.onclick = (e) => deleteConversation(conv.id, e);
    div.appendChild(title);
    div.appendChild(del);
    list.appendChild(div);
  }
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('collapsed');
}

function updateActiveConvMessages() {
  const conv = getActiveConv();
  if (conv) {
    conv.messages = [...messages];
    saveConversations();
  }
}

function setBusyState(isBusy) {
  busy = isBusy;
  const sendBtn = document.getElementById('send');
  if (isBusy) {
    sendBtn.textContent = '⏹ Stop';
    sendBtn.classList.add('stopping');
    sendBtn.disabled = false;
    sendBtn.onclick = stopGeneration;
  } else {
    sendBtn.textContent = 'Send';
    sendBtn.classList.remove('stopping');
    sendBtn.disabled = false;
    sendBtn.onclick = sendMessage;
    abortController = null;
  }
}

function stopGeneration() {
  if (abortController) {
    abortController.abort();
    abortController = null;
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 200) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {

function formatContent(text) {
  let html = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  // Links
  html = html.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  // Code blocks
  html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, code) => {
    return '\n\n<pre><code>' + code.trim() + '\n</code></pre>\n\n';
  });
  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Bold
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Markdown tables (GFM)
  html = html.replace(/^(\|.+\|)\n(\|[\s:|-]+\|)\n((?:\|.+\|\n?)+)/gm, (m, headerRow, sepRow, bodyRows) => {
    const parseCells = (row) => {
      return row.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
    };
    const headers = parseCells(headerRow);
    // Parse alignment from separator row
    const seps = parseCells(sepRow);
    const aligns = seps.map(s => {
      if (s.startsWith(':') && s.endsWith(':')) return 'center';
      if (s.endsWith(':')) return 'right';
      return 'left';
    });
    let table = '<table><thead><tr>';
    headers.forEach((h, i) => {
      table += `<th style="text-align:${aligns[i] || 'left'}">${h}</th>`;
    });
    table += '</tr></thead><tbody>';
    bodyRows.trim().split('\n').forEach(row => {
      row = row.trim();
      if (!row) return;
      const cells = parseCells(row);
      table += '<tr>';
      headers.forEach((_, i) => {
        table += `<td style="text-align:${aligns[i] || 'left'}">${cells[i] || ''}</td>`;
      });
      table += '</tr>';
    });
    table += '</tbody></table>';
    return table;
  });
  return html;
}

function copyToClipboard(text, btn) {
  // navigator.clipboard only works in secure contexts (HTTPS or localhost).
  // On a LAN HTTP connection, fall back to the legacy execCommand approach.
  const success = () => {
    if (btn) {
      const original = btn.textContent;
      btn.textContent = '✓';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = original;
        btn.classList.remove('copied');
      }, 1500);
    }
  };

  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(success).catch(() => {
      _copyFallback(text);
      success();
    });
  } else {
    _copyFallback(text);
    success();
  }
}

function _copyFallback(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
}

function enhanceCodeBlocks(container) {
  // Add copy buttons to all <pre> blocks that don't have one yet
  const pres = container.querySelectorAll('pre');
  for (const pre of pres) {
    if (pre.querySelector('.code-copy-btn')) continue;
    const btn = document.createElement('button');
    btn.className = 'code-copy-btn';
    btn.textContent = 'Copy';
    btn.onclick = (e) => {
      e.stopPropagation();
      const code = pre.querySelector('code');
      copyToClipboard(code ? code.textContent : pre.textContent, btn);
    };
    pre.appendChild(btn);
  }
}

function addMsg(role, content, reasoning) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const tag = document.createElement('div');
  tag.className = 'role-tag';
  tag.textContent = role === 'user' ? 'You' : 'Assistant';
  const body = document.createElement('div');
  // Placeholder HTML (starts with '<') is set directly; everything else is formatted
  if (content && content.startsWith('<')) {
    body.innerHTML = content;
  } else {
    let bodyHtml = '';
    if (reasoning) {
      bodyHtml += `<details class="thinking-block"><summary class="thinking-summary">💭 Thought process</summary><div class="thinking-content">${escapeHtml(reasoning)}</div></details>`;
    }
    bodyHtml += `<div class="msg-content">${formatContent(content || '')}</div>`;
    body.innerHTML = bodyHtml;
  }
  enhanceCodeBlocks(body);
  // Message-level copy button — prefers .msg-content text
  const copyBtn = document.createElement('button');
  copyBtn.className = 'msg-copy-btn';
  copyBtn.textContent = '📋';
  copyBtn.onclick = () => {
    const msgContent = body.querySelector('.msg-content');
    copyToClipboard(msgContent ? msgContent.textContent : body.textContent, copyBtn);
  };
  tag.appendChild(copyBtn);
  div.appendChild(tag);
  div.appendChild(body);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return body;
}

function addToolIndicator(query, results) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'tool-indicator';

  const icon = document.createElement('span');
  icon.className = 'tool-icon';
  icon.textContent = '🔍';

  const content = document.createElement('div');
  content.className = 'tool-content';

  const label = document.createElement('div');
  label.className = 'tool-label';
  label.innerHTML = results ? 'Web Search Complete' : '<span class="spinner"></span> Searching...';

  const queryEl = document.createElement('div');
  queryEl.className = 'tool-query';
  queryEl.textContent = `"${query}"`;

  content.appendChild(label);
  content.appendChild(queryEl);

  if (results) {
    const resultsEl = document.createElement('div');
    resultsEl.className = 'tool-results';
    // Parse results text into items
    const lines = results.split('\n').filter(l => l.trim());
    let items = [];
    let current = {};
    for (const line of lines) {
      const trimmed = line.trim();
      if (trimmed.startsWith('[') && trimmed.includes(']')) {
        if (current.title) items.push(current);
        current = { title: trimmed.split(']')[1]?.trim() || '', url: '', snippet: '' };
      } else if (trimmed.match(/^https?:\/\//)) {
        current.url = trimmed;
      } else {
        current.snippet = trimmed;
      }
    }
    if (current.title) items.push(current);

    for (const item of items) {
      const itemEl = document.createElement('div');
      itemEl.className = 'result-item';
      itemEl.innerHTML = `
        <div class="result-title">${escapeHtml(item.title)}</div>
        <div class="result-url">${escapeHtml(item.url)}</div>
        <div class="result-snippet">${escapeHtml(item.snippet)}</div>
      `;
      resultsEl.appendChild(itemEl);
    }
    content.appendChild(resultsEl);
  }

  div.appendChild(icon);
  div.appendChild(content);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function escapeHtml(text) {
  return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

async function sendMessage() {
  const input = document.getElementById('prompt');
  const text = input.value.trim();
  if (!text || busy) return;

  input.value = '';
  input.style.height = 'auto';

  messages.push({ role: 'user', content: text });
  addMsg('user', text);

  // Create conversation if this is the first message
  if (!activeConvId) {
    startNewConversation(text);
  } else {
    updateActiveConvMessages();
  }

  busy = true;
  setBusyState(true);

  const thinking = document.getElementById('think-toggle').checked;
  let assistantBody = addMsg('assistant', '<div class="typing-indicator"><span>Thinking</span><span class="typing-dots"><span></span><span></span><span></span></span></div>');

  abortController = new AbortController();
  let contentText = '';
  let reasoningText = '';
  let thinkingBlock = null;
  let thinkingSummary = null;
  let thinkingContent = null;
  let msgContent = null;

  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: messages.map(m => ({ role: m.role, content: m.content })),
        thinking: thinking,
        model: selectedModel || undefined,
        system_prompt: systemPrompt,
        include_datetime: includeDatetime,
        include_search: includeSearch,
      }),
      signal: abortController.signal,
    });

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      let gotDone = false;
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (!data) continue;

        try {
          const event = JSON.parse(data);

          if (event.type === 'reasoning') {
            if (!thinkingBlock) {
              assistantBody.innerHTML =
                '<details class="thinking-block" open>' +
                  '<summary class="thinking-summary">💭 Thinking...</summary>' +
                  '<div class="thinking-content"></div>' +
                '</details>' +
                '<div class="msg-content"></div>';
              thinkingBlock = assistantBody.querySelector('.thinking-block');
              thinkingSummary = assistantBody.querySelector('.thinking-summary');
              thinkingContent = assistantBody.querySelector('.thinking-content');
              msgContent = assistantBody.querySelector('.msg-content');
            }
            reasoningText += event.text;
            thinkingContent.textContent = reasoningText;
            thinkingContent.scrollTop = thinkingContent.scrollHeight;
            document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
          }
          else if (event.type === 'content') {
            if (thinkingBlock && thinkingBlock.hasAttribute('open')) {
              thinkingBlock.removeAttribute('open');
              if (thinkingSummary) thinkingSummary.textContent = '💭 Thought process';
            }
            if (!msgContent) {
              assistantBody.innerHTML = '<div class="msg-content"></div>';
              msgContent = assistantBody.querySelector('.msg-content');
            }
            contentText += event.text;
            msgContent.innerHTML = formatContent(contentText);
            enhanceCodeBlocks(msgContent);
            document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
          }
          else if (event.type === 'tool_call') {
            if (thinkingBlock && thinkingBlock.hasAttribute('open')) {
              thinkingBlock.removeAttribute('open');
              if (thinkingSummary) thinkingSummary.textContent = '💭 Thought process';
            }
            assistantBody.remove();
            addToolIndicator(event.query, null);
          }
          else if (event.type === 'tool_result') {
            // Update the last tool indicator with results
            const indicators = document.querySelectorAll('.tool-indicator');
            const last = indicators[indicators.length - 1];
            if (last) {
              const label = last.querySelector('.tool-label');
              const pagesFetched = event.pages_fetched !== undefined ? event.pages_fetched : '?';
              label.innerHTML = `Web Search Complete · ${pagesFetched} pages read`;
              const resultsEl = document.createElement('div');
              resultsEl.className = 'tool-results';
              const lines2 = event.results.split('\n').filter(l => l.trim());
              let items = [], current = {};
              for (const ln of lines2) {
                const trimmed = ln.trim();
                if (trimmed.startsWith('[') && trimmed.includes(']')) {
                  if (current.title) items.push(current);
                  current = { title: trimmed.split(']')[1]?.trim() || '', url: '', snippet: '' };
                } else if (trimmed.match(/^https?:\/\//)) {
                  current.url = trimmed;
                } else {
                  current.snippet = trimmed;
                }
              }
              if (current.title) items.push(current);
              for (const item of items) {
                const itemEl = document.createElement('div');
                itemEl.className = 'result-item';
                itemEl.innerHTML = `
                  <div class="result-title">${escapeHtml(item.title)}</div>
                  <div class="result-url">${escapeHtml(item.url)}</div>
                  <div class="result-snippet">${escapeHtml(item.snippet)}</div>
                `;
                resultsEl.appendChild(itemEl);
              }
              last.querySelector('.tool-content').appendChild(resultsEl);
            }
            // Re-add the assistant placeholder
            assistantBody = addMsg('assistant', '<div class="typing-indicator"><span>Processing results</span><span class="typing-dots"><span></span><span></span><span></span></span></div>');
            thinkingBlock = null;
            thinkingSummary = null;
            thinkingContent = null;
            msgContent = null;
            document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
          }
          else if (event.type === 'stats') {
            if (thinkingSummary && event.thinking_time_s > 0) {
              thinkingSummary.textContent = `💭 Thought for ${event.thinking_time_s}s`;
            }
            // Render token stats below the assistant message
            const msgDiv = assistantBody.closest('.msg');
            if (msgDiv) {
              let statsEl = msgDiv.querySelector('.msg-stats');
              if (!statsEl) {
                statsEl = document.createElement('div');
                statsEl.className = 'msg-stats';
                msgDiv.appendChild(statsEl);
              }
              let parts = [];
              if (event.thinking_tokens > 0) {
                parts.push(`💭 ${event.thinking_tokens} tok · ${event.thinking_tps} t/s · ${event.thinking_time_s}s`);
              }
              parts.push(`💬 ${event.content_tokens} tok · ${event.content_tps} t/s · ${event.content_time_s}s`);
              parts.push(`⚡ ${event.total_tps} t/s total`);
              parts.push(`⏱ ${event.gen_time_s}s`);
              statsEl.textContent = parts.join('  ·  ');
            }
          }
          else if (event.type === 'done') {
            if (thinkingBlock && thinkingBlock.hasAttribute('open')) {
              thinkingBlock.removeAttribute('open');
              if (thinkingSummary) thinkingSummary.textContent = '💭 Thought process';
            }
            const assistantMsg = { role: 'assistant', content: contentText };
            if (reasoningText) assistantMsg.reasoning = reasoningText;
            messages.push(assistantMsg);
            updateActiveConvMessages();
            gotDone = true;
          }
        } catch (e) {
          if (!e.message.includes('Unexpected token')) throw e;
        }
      }
      if (gotDone) break;  // server signals completion — exit immediately
    }

    // If we never got content (shouldn't happen), save what we can
    if (contentText) {
      // Already saved in 'done' event
    }
  } catch (e) {
    if (e.name === 'AbortError') {
      // User clicked Stop — save whatever partial content we have
      if ((contentText && contentText.trim()) || (reasoningText && reasoningText.trim())) {
        if (thinkingBlock && thinkingBlock.hasAttribute('open')) {
          thinkingBlock.removeAttribute('open');
          if (thinkingSummary) thinkingSummary.textContent = '💭 Thought process';
        }
        const assistantMsg = { role: 'assistant', content: contentText };
        if (reasoningText) assistantMsg.reasoning = reasoningText;
        messages.push(assistantMsg);
        updateActiveConvMessages();
      } else if (assistantBody) {
        // No content received — remove the empty placeholder
        assistantBody.closest('.msg')?.remove();
      }
    } else if (assistantBody) {
      assistantBody.innerHTML = '&#128683; Error: ' + e.message;
    }
  }

  setBusyState(false);
  document.getElementById('prompt').focus();
}

async function loadModels() {
  const select = document.getElementById('model-select');
  const btn = document.getElementById('model-refresh-btn');
  if (btn) { btn.style.transform = 'rotate(360deg)'; btn.style.transition = 'transform 0.5s'; setTimeout(() => { btn.style.transform = ''; btn.style.transition = ''; }, 500); }
  try {
    // Tell proxy to re-read its YAML config (picks up newly added models)
    await fetch(VLLM_REFRESH_URL, { method: 'POST' }).catch(() => {});
    const resp = await fetch(VLLM_MODELS_URL);
    const data = await resp.json();
    select.innerHTML = '';
    data.data.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m.id;
      opt.textContent = m.id;
      if (m.loaded) opt.textContent += ' ✓';
      select.appendChild(opt);
    });
    const loaded = data.data.find(m => m.loaded);
    if (selectedModel && data.data.find(m => m.id === selectedModel)) {
      select.value = selectedModel;
    } else if (loaded) {
      select.value = loaded.id;
      selectedModel = loaded.id;
    }
  } catch (e) {
    console.error('Failed to load models:', e);
    select.innerHTML = '<option value="">Default</option>';
  }
}

function onModelChange() {
  selectedModel = document.getElementById('model-select').value;
  localStorage.setItem('chat-selected-model', selectedModel);
}
