<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qwen3.6-27B Chat</title>
<style>
:root {
  --bg: #1a1a2e;
  --surface: #16213e;
  --surface2: #0f3460;
  --accent: #e94560;
  --text: #eee;
  --text-dim: #999;
  --user-bg: #0f3460;
  --bot-bg: #1a1a2e;
  --radius: 12px;
  --tool-bg: #1b2838;
  --tool-border: #2a4a6b;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: row;
  overflow: hidden;
}
/* Sidebar */
#sidebar {
  width: 240px;
  flex-shrink: 0;
  background: #111;
  border-right: 1px solid rgba(255,255,255,0.05);
  display: flex;
  flex-direction: column;
  transition: margin-left 0.2s ease;
}
#sidebar.collapsed { margin-left: -240px; }
#sidebar-header {
  padding: 12px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
#new-chat-btn {
  flex: 1;
  background: var(--surface2);
  color: var(--text);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  text-align: center;
}
#new-chat-btn:hover { background: var(--accent); }
#conv-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}
.conv-item {
  padding: 8px 10px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  margin-bottom: 2px;
  transition: background 0.15s;
}
.conv-item:hover { background: rgba(255,255,255,0.05); }
.conv-item.active { background: var(--surface2); color: var(--text); }
.conv-item .conv-title {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.conv-item .conv-delete {
  opacity: 0;
  flex-shrink: 0;
  font-size: 14px;
  color: var(--text-dim);
  background: none;
  border: none;
  cursor: pointer;
  padding: 0 2px;
}
.conv-item:hover .conv-delete { opacity: 0.6; }
.conv-item .conv-delete:hover { opacity: 1; color: var(--accent); }
/* Main content */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
#header {
  background: var(--surface);
  padding: 12px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
#header h1 { font-size: 16px; font-weight: 600; }
#header .subtitle { font-size: 12px; color: var(--text-dim); }
#status-dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #444;
  margin-right: 6px;
}
#status-dot.online { background: #4ade80; }
#chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.msg {
  max-width: 85%;
  padding: 14px 18px;
  border-radius: var(--radius);
  line-height: 1.6;
  font-size: 14px;
  white-space: pre-wrap;
  word-wrap: break-word;
}
.msg.user {
  background: var(--user-bg);
  align-self: flex-end;
  border-bottom-right-radius: 4px;
}
.msg.assistant {
  background: var(--surface);
  align-self: flex-start;
  border-bottom-left-radius: 4px;
  border: 1px solid rgba(255,255,255,0.05);
  max-width: 90%;
}
.msg .role-tag {
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 4px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
/* Tool call indicators */
.tool-indicator {
  align-self: center;
  max-width: 70%;
  width: 100%;
  background: var(--tool-bg);
  border: 1px solid var(--tool-border);
  border-radius: var(--radius);
  padding: 10px 16px;
  font-size: 13px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.tool-indicator .tool-icon {
  font-size: 16px;
  flex-shrink: 0;
  margin-top: 2px;
}
.tool-indicator .tool-content { flex: 1; }
.tool-indicator .tool-label {
  font-weight: 600;
  font-size: 12px;
  color: #60a5fa;
  margin-bottom: 2px;
}
.tool-indicator .tool-query {
  color: var(--text-dim);
  font-style: italic;
}
.tool-indicator .tool-results {
  margin-top: 8px;
  color: var(--text);
  font-size: 12px;
  line-height: 1.5;
  max-height: 150px;
  overflow-y: auto;
}
.tool-indicator .tool-results .result-item {
  padding: 6px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.tool-indicator .tool-results .result-item:last-child { border-bottom: none; }
.tool-indicator .tool-results .result-title {
  color: #60a5fa;
  font-weight: 500;
}
.tool-indicator .tool-results .result-url {
  color: #4ade80;
  font-size: 11px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.tool-indicator .tool-results .result-snippet {
  color: var(--text-dim);
  font-size: 12px;
}
/* Spinner */
.spinner {
  display: inline-block;
  width: 14px;
  height: 14px;
  border: 2px solid var(--tool-border);
  border-top-color: #60a5fa;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  vertical-align: middle;
  margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }
/* Input area */
#input-area {
  background: var(--surface);
  padding: 16px 20px;
  border-top: 1px solid rgba(255,255,255,0.05);
  display: flex;
  gap: 10px;
  align-items: flex-end;
}
#prompt {
  flex: 1;
  background: var(--bg);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: var(--radius);
  color: var(--text);
  padding: 12px 16px;
  font-size: 14px;
  font-family: inherit;
  resize: none;
  min-height: 24px;
  max-height: 200px;
  line-height: 1.5;
}
#prompt:focus { outline: none; border-color: var(--accent); }
#send {
  background: var(--accent);
  color: white;
  border: none;
  border-radius: var(--radius);
  padding: 12px 24px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: opacity 0.2s;
}
#send:hover { opacity: 0.9; }
#send:disabled { opacity: 0.4; cursor: not-allowed; }
#send.stopping { background: #e74c3c; }
#controls {
  display: flex;
  gap: 12px;
  align-items: center;
  font-size: 12px;
}
#controls label { color: var(--text-dim); display: flex; align-items: center; gap: 4px; }
#controls input[type="checkbox"] { accent-color: var(--accent); }
#clear-btn {
  background: transparent;
  color: var(--text-dim);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 12px;
  cursor: pointer;
}
#clear-btn:hover { color: var(--text); }
.typing { color: var(--text-dim); font-style: italic; }
.typing-indicator { display: flex; align-items: center; gap: 8px; color: var(--text-dim); font-style: italic; }
.typing-dots { display: inline-flex; gap: 4px; }
.typing-dots span {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--text-dim);
  animation: typing-dot 1.4s infinite ease-in-out;
}
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes typing-dot {
  0%, 60%, 100% { opacity: 0.3; transform: scale(0.8); }
  30% { opacity: 1; transform: scale(1.2); }
}
code { background: rgba(255,255,255,0.08); padding: 2px 6px; border-radius: 4px; font-size: 13px; }
pre { background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; overflow-x: auto; margin: 8px 0; position: relative; }
pre code { background: none; padding: 0; }
pre .code-copy-btn {
  position: absolute;
  top: 6px; right: 6px;
  background: rgba(255,255,255,0.08);
  color: var(--text-dim);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 4px;
  padding: 2px 8px;
  font-size: 11px;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.15s;
}
pre:hover .code-copy-btn { opacity: 1; }
pre .code-copy-btn:hover { background: rgba(255,255,255,0.15); color: var(--text); }
pre .code-copy-btn.copied { background: #2d5a3d; color: #4ade80; opacity: 1; }
.msg-copy-btn {
  background: none;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 12px;
  opacity: 0;
  transition: opacity 0.15s;
  padding: 0 4px;
}
.msg:hover .msg-copy-btn { opacity: 0.5; }
.msg-copy-btn:hover { opacity: 1 !important; }
.msg-copy-btn.copied { opacity: 1 !important; color: #4ade80; }
a { color: #60a5fa; text-decoration: none; }
a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <button id="new-chat-btn" onclick="newChat()">+ New Chat</button>
  </div>
  <div id="conv-list"></div>
</div>

<div id="main">
<div id="header">
  <div style="display: flex; align-items: center; gap: 10px;">
    <button id="sidebar-toggle" onclick="toggleSidebar()" style="background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 18px; padding: 4px;">☰</button>
    <div>
      <h1>&#129302; Qwen3.6-27B Chat</h1>
      <div class="subtitle"><span id="status-dot"></span><span id="status-text">Connecting...</span></div>
    </div>
  </div>
  <div id="controls">
    <label><input type="checkbox" id="think-toggle" checked> Thinking</label>
    <button id="clear-btn" onclick="clearChat()">Clear</button>
  </div>
</div>

<div id="chat"></div>

<div id="input-area">
  <textarea id="prompt" placeholder="Type a message... (Enter to send, Shift+Enter for new line)" rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
  <button id="send" onclick="sendMessage()">Send</button>
</div>
</div>

<script>
const API_URL = '/chat';
let messages = [];
let busy = false;
let conversations = [];      // [{id, title, messages}]
let activeConvId = null;
let abortController = null;  // AbortController for the active fetch, if any

// ── Conversation persistence ────────────────────────────────────────────────
const STORAGE_KEY = 'lan-chat-conversations';

function loadConversations() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    conversations = raw ? JSON.parse(raw) : [];
  } catch { conversations = []; }
  // Restore active conversation
  const lastId = localStorage.getItem(STORAGE_KEY + ':active');
  if (lastId && conversations.find(c => c.id === lastId)) {
    activeConvId = lastId;
  } else if (conversations.length > 0) {
    activeConvId = conversations[0].id;
  }
}

function saveConversations() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
}

function getActiveConv() {
  return conversations.find(c => c.id === activeConvId);
}

function newChat() {
  activeConvId = null;
  messages = [];
  document.getElementById('chat').innerHTML = '';
  renderConvList();
  saveConversations();
  document.getElementById('prompt').focus();
}

function startNewConversation(firstMsg) {
  const conv = {
    id: 'c' + Date.now(),
    title: firstMsg.slice(0, 40) + (firstMsg.length > 40 ? '…' : ''),
    messages: [{ role: 'user', content: firstMsg }],
  };
  conversations.unshift(conv);
  activeConvId = conv.id;
  renderConvList();
  saveConversations();
}

function switchConversation(convId) {
  const conv = conversations.find(c => c.id === convId);
  if (!conv) return;
  activeConvId = convId;
  messages = [...conv.messages];
  localStorage.setItem(STORAGE_KEY + ':active', convId);
  // Rebuild chat UI
  const chat = document.getElementById('chat');
  chat.innerHTML = '';
  for (const msg of conv.messages) {
    if (msg.role === 'user') addMsg('user', msg.content);
    else if (msg.role === 'assistant') addMsg('assistant', msg.content);
  }
  renderConvList();
  document.getElementById('prompt').focus();
}

function deleteConversation(convId, event) {
  event.stopPropagation();
  conversations = conversations.filter(c => c.id !== convId);
  if (activeConvId === convId) {
    if (conversations.length > 0) {
      switchConversation(conversations[0].id);
    } else {
      newChat();
    }
  }
  renderConvList();
  saveConversations();
}

function renderConvList() {
  const list = document.getElementById('conv-list');
  list.innerHTML = '';
  for (const conv of conversations) {
    const div = document.createElement('div');
    div.className = 'conv-item' + (conv.id === activeConvId ? ' active' : '');
    div.onclick = () => switchConversation(conv.id);
    const title = document.createElement('span');
    title.className = 'conv-title';
    title.textContent = conv.title;
    const del = document.createElement('button');
    del.className = 'conv-delete';
    del.textContent = '×';
    del.onclick = (e) => deleteConversation(conv.id, e);
    div.appendChild(title);
    div.appendChild(del);
    list.appendChild(div);
  }
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('collapsed');
}

function updateActiveConvMessages() {
  const conv = getActiveConv();
  if (conv) {
    conv.messages = [...messages];
    saveConversations();
  }
}

function setBusyState(isBusy) {
  busy = isBusy;
  const sendBtn = document.getElementById('send');
  if (isBusy) {
    sendBtn.textContent = '⏹ Stop';
    sendBtn.classList.add('stopping');
    sendBtn.disabled = false;
    sendBtn.onclick = stopGeneration;
  } else {
    sendBtn.textContent = 'Send';
    sendBtn.classList.remove('stopping');
    sendBtn.disabled = false;
    sendBtn.onclick = sendMessage;
    abortController = null;
  }
}

function stopGeneration() {
  if (abortController) {
    abortController.abort();
    abortController = null;
  }
}

// ── Check server status ─────────────────────────────────────────────────────
fetch('/chat.html')
  .then(r => {
    document.getElementById('status-dot').classList.add('online');
    document.getElementById('status-text').textContent = 'Online · Web Search Enabled';
  })
  .catch(() => {
    document.getElementById('status-text').textContent = 'Offline — check server';
  });

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 200) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function formatContent(text) {
  let html = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  // Links
  html = html.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  // Code blocks
  html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, code) => {
    return '<pre><code>' + code.trim() + '</code></pre>';
  });
  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Bold
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  return html;
}

function copyToClipboard(text, btn) {
  // navigator.clipboard only works in secure contexts (HTTPS or localhost).
  // On a LAN HTTP connection, fall back to the legacy execCommand approach.
  const success = () => {
    if (btn) {
      const original = btn.textContent;
      btn.textContent = '✓';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = original;
        btn.classList.remove('copied');
      }, 1500);
    }
  };

  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(success).catch(() => {
      _copyFallback(text);
      success();
    });
  } else {
    _copyFallback(text);
    success();
  }
}

function _copyFallback(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
}

function enhanceCodeBlocks(container) {
  // Add copy buttons to all <pre> blocks that don't have one yet
  const pres = container.querySelectorAll('pre');
  for (const pre of pres) {
    if (pre.querySelector('.code-copy-btn')) continue;
    const btn = document.createElement('button');
    btn.className = 'code-copy-btn';
    btn.textContent = 'Copy';
    btn.onclick = (e) => {
      e.stopPropagation();
      const code = pre.querySelector('code');
      copyToClipboard(code ? code.textContent : pre.textContent, btn);
    };
    pre.appendChild(btn);
  }
}

function addMsg(role, content) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const tag = document.createElement('div');
  tag.className = 'role-tag';
  tag.textContent = role === 'user' ? 'You' : 'Assistant';
  const body = document.createElement('div');
  // Placeholder HTML (starts with '<') is set directly; everything else is formatted
  if (content.startsWith('<')) {
    body.innerHTML = content;
  } else {
    body.innerHTML = formatContent(content);
  }
  enhanceCodeBlocks(body);
  // Message-level copy button — reads body.textContent at click time,
  // so it captures the final rendered text even after streaming replaces it
  const copyBtn = document.createElement('button');
  copyBtn.className = 'msg-copy-btn';
  copyBtn.textContent = '📋';
  copyBtn.onclick = () => copyToClipboard(body.textContent, copyBtn);
  tag.appendChild(copyBtn);
  div.appendChild(tag);
  div.appendChild(body);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return body;
}

function addToolIndicator(query, results) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'tool-indicator';

  const icon = document.createElement('span');
  icon.className = 'tool-icon';
  icon.textContent = '🔍';

  const content = document.createElement('div');
  content.className = 'tool-content';

  const label = document.createElement('div');
  label.className = 'tool-label';
  label.innerHTML = results ? 'Web Search Complete' : '<span class="spinner"></span> Searching...';

  const queryEl = document.createElement('div');
  queryEl.className = 'tool-query';
  queryEl.textContent = `"${query}"`;

  content.appendChild(label);
  content.appendChild(queryEl);

  if (results) {
    const resultsEl = document.createElement('div');
    resultsEl.className = 'tool-results';
    // Parse results text into items
    const lines = results.split('\n').filter(l => l.trim());
    let items = [];
    let current = {};
    for (const line of lines) {
      const trimmed = line.trim();
      if (trimmed.startsWith('[') && trimmed.includes(']')) {
        if (current.title) items.push(current);
        current = { title: trimmed.split(']')[1]?.trim() || '', url: '', snippet: '' };
      } else if (trimmed.match(/^https?:\/\//)) {
        current.url = trimmed;
      } else {
        current.snippet = trimmed;
      }
    }
    if (current.title) items.push(current);

    for (const item of items) {
      const itemEl = document.createElement('div');
      itemEl.className = 'result-item';
      itemEl.innerHTML = `
        <div class="result-title">${escapeHtml(item.title)}</div>
        <div class="result-url">${escapeHtml(item.url)}</div>
        <div class="result-snippet">${escapeHtml(item.snippet)}</div>
      `;
      resultsEl.appendChild(itemEl);
    }
    content.appendChild(resultsEl);
  }

  div.appendChild(icon);
  div.appendChild(content);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function escapeHtml(text) {
  return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

async function sendMessage() {
  const input = document.getElementById('prompt');
  const text = input.value.trim();
  if (!text || busy) return;

  input.value = '';
  input.style.height = 'auto';

  messages.push({ role: 'user', content: text });
  addMsg('user', text);

  // Create conversation if this is the first message
  if (!activeConvId) {
    startNewConversation(text);
  } else {
    updateActiveConvMessages();
  }

  busy = true;
  setBusyState(true);

  const thinking = document.getElementById('think-toggle').checked;
  let assistantBody = addMsg('assistant', '<div class="typing-indicator"><span>Thinking</span><span class="typing-dots"><span></span><span></span><span></span></span></div>');

  abortController = new AbortController();
  let contentText = '';

  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: messages,
        thinking: thinking,
      }),
      signal: abortController.signal,
    });

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      let gotDone = false;
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (!data) continue;

        try {
          const event = JSON.parse(data);

          if (event.type === 'content') {
            contentText += event.text;
            assistantBody.innerHTML = formatContent(contentText);
            enhanceCodeBlocks(assistantBody);
            document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
          }
          else if (event.type === 'tool_call') {
            // Clear the "Thinking..." placeholder before showing tool
            assistantBody.remove();
            addToolIndicator(event.query, null);
          }
          else if (event.type === 'tool_result') {
            // Update the last tool indicator with results
            const indicators = document.querySelectorAll('.tool-indicator');
            const last = indicators[indicators.length - 1];
            if (last) {
              const label = last.querySelector('.tool-label');
              const pagesFetched = event.pages_fetched !== undefined ? event.pages_fetched : '?';
              label.innerHTML = `Web Search Complete · ${pagesFetched} pages read`;
              const resultsEl = document.createElement('div');
              resultsEl.className = 'tool-results';
              const lines2 = event.results.split('\n').filter(l => l.trim());
              let items = [], current = {};
              for (const ln of lines2) {
                const trimmed = ln.trim();
                if (trimmed.startsWith('[') && trimmed.includes(']')) {
                  if (current.title) items.push(current);
                  current = { title: trimmed.split(']')[1]?.trim() || '', url: '', snippet: '' };
                } else if (trimmed.match(/^https?:\/\//)) {
                  current.url = trimmed;
                } else {
                  current.snippet = trimmed;
                }
              }
              if (current.title) items.push(current);
              for (const item of items) {
                const itemEl = document.createElement('div');
                itemEl.className = 'result-item';
                itemEl.innerHTML = `
                  <div class="result-title">${escapeHtml(item.title)}</div>
                  <div class="result-url">${escapeHtml(item.url)}</div>
                  <div class="result-snippet">${escapeHtml(item.snippet)}</div>
                `;
                resultsEl.appendChild(itemEl);
              }
              last.querySelector('.tool-content').appendChild(resultsEl);
            }
            // Re-add the assistant placeholder
            assistantBody = addMsg('assistant', '<div class="typing-indicator"><span>Processing results</span><span class="typing-dots"><span></span><span></span><span></span></span></div>');
            document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
          }
          else if (event.type === 'done') {
            // Finalize
            messages.push({ role: 'assistant', content: contentText });
            updateActiveConvMessages();
            gotDone = true;
          }
        } catch (e) {
          if (!e.message.includes('Unexpected token')) throw e;
        }
      }
      if (gotDone) break;  // server signals completion — exit immediately
    }

    // If we never got content (shouldn't happen), save what we can
    if (contentText) {
      // Already saved in 'done' event
    }
  } catch (e) {
    if (e.name === 'AbortError') {
      // User clicked Stop — save whatever partial content we have
      if (contentText && contentText.trim()) {
        assistantBody.innerHTML = formatContent(contentText);
        enhanceCodeBlocks(assistantBody);
        messages.push({ role: 'assistant', content: contentText });
        updateActiveConvMessages();
      } else if (assistantBody) {
        // No content received — remove the empty placeholder
        assistantBody.closest('.msg')?.remove();
      }
    } else if (assistantBody) {
      assistantBody.innerHTML = '&#128683; Error: ' + e.message;
    }
  }

  setBusyState(false);
  document.getElementById('prompt').focus();
}

function clearChat() {
  newChat();
}

// ── Initialize on page load ─────────────────────────────────────────────────
loadConversations();
renderConvList();
if (activeConvId) {
  switchConversation(activeConvId);
} else {
  newChat();
}

document.getElementById('prompt').focus();
</script>
