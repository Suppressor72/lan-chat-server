<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qwen3.6-27B Chat</title>
<style>
:root {
  --bg: #1a1a2e;
  --surface: #16213e;
  --surface2: #0f3460;
  --accent: #e94560;
  --text: #eee;
  --text-dim: #999;
  --user-bg: #0f3460;
  --bot-bg: #1a1a2e;
  --radius: 12px;
  --tool-bg: #1b2838;
  --tool-border: #2a4a6b;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
}
#header {
  background: var(--surface);
  padding: 12px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
#header h1 { font-size: 16px; font-weight: 600; }
#header .subtitle { font-size: 12px; color: var(--text-dim); }
#status-dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #444;
  margin-right: 6px;
}
#status-dot.online { background: #4ade80; }
#chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.msg {
  max-width: 85%;
  padding: 14px 18px;
  border-radius: var(--radius);
  line-height: 1.6;
  font-size: 14px;
  white-space: pre-wrap;
  word-wrap: break-word;
}
.msg.user {
  background: var(--user-bg);
  align-self: flex-end;
  border-bottom-right-radius: 4px;
}
.msg.assistant {
  background: var(--surface);
  align-self: flex-end;
  border-bottom-left-radius: 4px;
  border: 1px solid rgba(255,255,255,0.05);
  max-width: 90%;
}
.msg .role-tag {
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 4px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
/* Tool call indicators */
.tool-indicator {
  align-self: center;
  max-width: 70%;
  width: 100%;
  background: var(--tool-bg);
  border: 1px solid var(--tool-border);
  border-radius: var(--radius);
  padding: 10px 16px;
  font-size: 13px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.tool-indicator .tool-icon {
  font-size: 16px;
  flex-shrink: 0;
  margin-top: 2px;
}
.tool-indicator .tool-content { flex: 1; }
.tool-indicator .tool-label {
  font-weight: 600;
  font-size: 12px;
  color: #60a5fa;
  margin-bottom: 2px;
}
.tool-indicator .tool-query {
  color: var(--text-dim);
  font-style: italic;
}
.tool-indicator .tool-results {
  margin-top: 8px;
  color: var(--text);
  font-size: 12px;
  line-height: 1.5;
  max-height: 150px;
  overflow-y: auto;
}
.tool-indicator .tool-results .result-item {
  padding: 6px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.tool-indicator .tool-results .result-item:last-child { border-bottom: none; }
.tool-indicator .tool-results .result-title {
  color: #60a5fa;
  font-weight: 500;
}
.tool-indicator .tool-results .result-url {
  color: #4ade80;
  font-size: 11px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.tool-indicator .tool-results .result-snippet {
  color: var(--text-dim);
  font-size: 12px;
}
/* Spinner */
.spinner {
  display: inline-block;
  width: 14px;
  height: 14px;
  border: 2px solid var(--tool-border);
  border-top-color: #60a5fa;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  vertical-align: middle;
  margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }
/* Input area */
#input-area {
  background: var(--surface);
  padding: 16px 20px;
  border-top: 1px solid rgba(255,255,255,0.05);
  display: flex;
  gap: 10px;
  align-items: flex-end;
}
#prompt {
  flex: 1;
  background: var(--bg);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: var(--radius);
  color: var(--text);
  padding: 12px 16px;
  font-size: 14px;
  font-family: inherit;
  resize: none;
  min-height: 24px;
  max-height: 200px;
  line-height: 1.5;
}
#prompt:focus { outline: none; border-color: var(--accent); }
#send {
  background: var(--accent);
  color: white;
  border: none;
  border-radius: var(--radius);
  padding: 12px 24px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: opacity 0.2s;
}
#send:hover { opacity: 0.9; }
#send:disabled { opacity: 0.4; cursor: not-allowed; }
#controls {
  display: flex;
  gap: 12px;
  align-items: center;
  font-size: 12px;
}
#controls label { color: var(--text-dim); display: flex; align-items: center; gap: 4px; }
#controls input[type="checkbox"] { accent-color: var(--accent); }
#clear-btn {
  background: transparent;
  color: var(--text-dim);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 12px;
  cursor: pointer;
}
#clear-btn:hover { color: var(--text); }
.typing { color: var(--text-dim); font-style: italic; }
code { background: rgba(255,255,255,0.08); padding: 2px 6px; border-radius: 4px; font-size: 13px; }
pre { background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; overflow-x: auto; margin: 8px 0; }
pre code { background: none; padding: 0; }
a { color: #60a5fa; text-decoration: none; }
a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div id="header">
  <div>
    <h1>&#129302; Qwen3.6-27B Chat</h1>
    <div class="subtitle"><span id="status-dot"></span><span id="status-text">Connecting...</span></div>
  </div>
  <div id="controls">
    <label><input type="checkbox" id="think-toggle" checked> Thinking</label>
    <button id="clear-btn" onclick="clearChat()">Clear</button>
  </div>
</div>

<div id="chat"></div>

<div id="input-area">
  <textarea id="prompt" placeholder="Type a message... (Enter to send, Shift+Enter for new line)" rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
  <button id="send" onclick="sendMessage()">Send</button>
</div>

<script>
const API_URL = '/chat';
let messages = [];
let busy = false;

// Check server status
fetch('/chat.html')
  .then(r => {
    document.getElementById('status-dot').classList.add('online');
    document.getElementById('status-text').textContent = 'Online · Web Search Enabled';
  })
  .catch(() => {
    document.getElementById('status-text').textContent = 'Offline — check server';
  });

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 200) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function formatContent(text) {
  let html = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  // Links
  html = html.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  // Code blocks
  html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, code) => {
    return '<pre><code>' + code.trim() + '</code></pre>';
  });
  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Bold
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  return html;
}

function addMsg(role, content) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const tag = document.createElement('div');
  tag.className = 'role-tag';
  tag.textContent = role === 'user' ? 'You' : 'Assistant';
  const body = document.createElement('div');
  body.innerHTML = formatContent(content);
  div.appendChild(tag);
  div.appendChild(body);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return body;
}

function addToolIndicator(query, results) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'tool-indicator';

  const icon = document.createElement('span');
  icon.className = 'tool-icon';
  icon.textContent = '🔍';

  const content = document.createElement('div');
  content.className = 'tool-content';

  const label = document.createElement('div');
  label.className = 'tool-label';
  label.innerHTML = results ? 'Web Search Complete' : '<span class="spinner"></span> Searching...';

  const queryEl = document.createElement('div');
  queryEl.className = 'tool-query';
  queryEl.textContent = `"${query}"`;

  content.appendChild(label);
  content.appendChild(queryEl);

  if (results) {
    const resultsEl = document.createElement('div');
    resultsEl.className = 'tool-results';
    // Parse results text into items
    const lines = results.split('\n').filter(l => l.trim());
    let items = [];
    let current = {};
    for (const line of lines) {
      const trimmed = line.trim();
      if (trimmed.startsWith('[') && trimmed.includes(']')) {
        if (current.title) items.push(current);
        current = { title: trimmed.split(']')[1]?.trim() || '', url: '', snippet: '' };
      } else if (trimmed.match(/^https?:\/\//)) {
        current.url = trimmed;
      } else {
        current.snippet = trimmed;
      }
    }
    if (current.title) items.push(current);

    for (const item of items) {
      const itemEl = document.createElement('div');
      itemEl.className = 'result-item';
      itemEl.innerHTML = `
        <div class="result-title">${escapeHtml(item.title)}</div>
        <div class="result-url">${escapeHtml(item.url)}</div>
        <div class="result-snippet">${escapeHtml(item.snippet)}</div>
      `;
      resultsEl.appendChild(itemEl);
    }
    content.appendChild(resultsEl);
  }

  div.appendChild(icon);
  div.appendChild(content);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function escapeHtml(text) {
  return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

async function sendMessage() {
  const input = document.getElementById('prompt');
  const text = input.value.trim();
  if (!text || busy) return;

  input.value = '';
  input.style.height = 'auto';

  messages.push({ role: 'user', content: text });
  addMsg('user', text);

  busy = true;
  document.getElementById('send').disabled = true;

  const thinking = document.getElementById('think-toggle').checked;
  let assistantBody = addMsg('assistant', '<span class="typing">Thinking...</span>');

  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: messages,
        thinking: thinking,
      })
    });

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let contentText = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      let gotDone = false;
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (!data) continue;

        try {
          const event = JSON.parse(data);

          if (event.type === 'content') {
            contentText += event.text;
            assistantBody.innerHTML = formatContent(contentText);
            document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
          }
          else if (event.type === 'tool_call') {
            // Clear the "Thinking..." placeholder before showing tool
            assistantBody.remove();
            addToolIndicator(event.query, null);
          }
          else if (event.type === 'tool_result') {
            // Update the last tool indicator with results
            const indicators = document.querySelectorAll('.tool-indicator');
            const last = indicators[indicators.length - 1];
            if (last) {
              const label = last.querySelector('.tool-label');
              const pagesFetched = event.pages_fetched !== undefined ? event.pages_fetched : '?';
              label.innerHTML = `Web Search Complete · ${pagesFetched} pages read`;
              const resultsEl = document.createElement('div');
              resultsEl.className = 'tool-results';
              const lines2 = event.results.split('\n').filter(l => l.trim());
              let items = [], current = {};
              for (const ln of lines2) {
                const trimmed = ln.trim();
                if (trimmed.startsWith('[') && trimmed.includes(']')) {
                  if (current.title) items.push(current);
                  current = { title: trimmed.split(']')[1]?.trim() || '', url: '', snippet: '' };
                } else if (trimmed.match(/^https?:\/\//)) {
                  current.url = trimmed;
                } else {
                  current.snippet = trimmed;
                }
              }
              if (current.title) items.push(current);
              for (const item of items) {
                const itemEl = document.createElement('div');
                itemEl.className = 'result-item';
                itemEl.innerHTML = `
                  <div class="result-title">${escapeHtml(item.title)}</div>
                  <div class="result-url">${escapeHtml(item.url)}</div>
                  <div class="result-snippet">${escapeHtml(item.snippet)}</div>
                `;
                resultsEl.appendChild(itemEl);
              }
              last.querySelector('.tool-content').appendChild(resultsEl);
            }
            // Re-add the assistant placeholder
            assistantBody = addMsg('assistant', '<span class="typing">Processing results...</span>');
            document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
          }
          else if (event.type === 'done') {
            // Finalize
            messages.push({ role: 'assistant', content: contentText });
            gotDone = true;
          }
        } catch (e) {
          if (!e.message.includes('Unexpected token')) throw e;
        }
      }
      if (gotDone) break;  // server signals completion — exit immediately
    }

    // If we never got content (shouldn't happen), save what we can
    if (contentText) {
      // Already saved in 'done' event
    }
  } catch (e) {
    if (assistantBody) assistantBody.innerHTML = '&#128683; Error: ' + e.message;
  }

  busy = false;
  document.getElementById('send').disabled = false;
  document.getElementById('prompt').focus();
}

function clearChat() {
  messages = [];
  document.getElementById('chat').innerHTML = '';
}

document.getElementById('prompt').focus();
</script>
</body>
</html>
